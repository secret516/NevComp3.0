name: "Easy XSS"
author: "n19"

description: |
  NevCorp punya portal SOC internal buat staff mereka.
  Katanya sih aman, tapi SOC Lead selalu ngecek laporan yang masuk...

  Bisa nggak kamu masuk dan ambil flag dari panel admin?

type: "DynamicContainer"
value: 1000

provide: "./src"

container:
  flagTemplate: "NevComp3.0{sqli_4uth_byp4ss_th3n_st0r3d_xss}"
  containerImage: "{{.slug}}:latest"
  memoryLimit: 1024
  cpuCount: 2
  storageLimit: 1024
  exposePort: 3000
  enableTrafficCapture: false

scripts:
  start: docker build -t {{.slug}} .
