<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>{% block title %}NevCloud{% endblock %}</title>
<style>
  :root { color-scheme: light; }
  body { font-family: 'Segoe UI', Arial, sans-serif; background: #0b1220; margin: 0; color: #1a1a1a; }
  nav { background: #0f172a; color: #fff; padding: 14px 28px; display: flex; justify-content: space-between; align-items: center; border-bottom: 3px solid #06b6d4; }
  nav a { color: #cbd5e1; text-decoration: none; margin-left: 18px; font-weight: 600; }
  nav a:hover { color: #fff; }
  .brand { font-size: 1.3em; font-weight: 700; color: #22d3ee; }
  .container { max-width: 900px; margin: 40px auto; background: #fff; padding: 32px 40px; border-radius: 10px; box-shadow: 0 4px 24px rgba(0,0,0,.35); }
  h1 { margin-top: 0; }
  input, textarea { width: 100%; padding: 10px; margin: 6px 0 16px; border: 1px solid #cbd5e1; border-radius: 6px; box-sizing: border-box; font-size: 1em; font-family: inherit; }
  button { background: #0891b2; color: #fff; border: none; padding: 10px 22px; border-radius: 6px; cursor: pointer; font-size: 1em; }
  button:hover { background: #0e7490; }
  .error { color: #a33; background: #fde8e8; padding: 10px 14px; border-radius: 6px; margin-bottom: 14px; }
  table { width: 100%; border-collapse: collapse; margin-top: 10px; }
  th, td { text-align: left; padding: 10px; border-bottom: 1px solid #eee; }
  .badge { background: #0891b2; color: #fff; padding: 2px 9px; border-radius: 10px; font-size: .78em; }
  .status-running { color: #16a34a; font-weight: 600; }
  .status-stopped { color: #a3a3a3; font-weight: 600; }
  pre { background: #1e1e1e; color: #d4d4d4; padding: 16px; border-radius: 8px; overflow-x: auto; }
</style>
</head>
<body>
<nav>
  <span class="brand">☁ NevCloud</span>
  <div>
    <a href="{{ url_for('dashboard') }}">Dashboard</a>
    <a href="{{ url_for('help_center') }}">Help</a>
    <a href="{{ url_for('admin') }}">Admin</a>
    <a href="{{ url_for('logout') }}">Logout</a>
  </div>
</nav>
<div class="container">
{% block content %}{% endblock %}
</div>
</body>
</html>
