# yaml-language-server: $schema=https://raw.githubusercontent.com/dimasma0305/gzcli/refs/heads/master/internal/template/templates/others/ctf-template/.gzctf/challenge.schema.yaml
name: "Broken Broadcast"
author: "Gengg"

description: |
  A secret repeated too many times ceases to be a secret.

type: "DynamicContainer"
value: 1000

provide: "./dist"

container:
  flagTemplate: "NevComp3.0{stop_shouting_the_same_secret_everywhere}"
  containerImage: "{{.slug}}:latest"
  memoryLimit: 512
  cpuCount: 2
  storageLimit: 512
  exposePort: 5000
  enableTrafficCapture: false

scripts:
  start: docker build -t {{.slug}} .